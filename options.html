<!doctype html>
<html><head><meta charset="utf-8"><title>Mass-Follower Filter</title>
<style>
 body { font: 14px system-ui, sans-serif; width: 300px; padding: 12px; }
 label { display: block; margin: 10px 0 4px; } input[type=number], textarea { width: 100%; box-sizing: border-box; }
 #saved { color: green; margin-left: 8px; }
</style></head>
<body>
 <h3>Mass-Follower Filter</h3>
 <label><input type="checkbox" id="enabled"> Filter on</label>
 <label for="threshold">Hide posts by accounts following at least</label>
 <input type="number" id="threshold" min="1" step="100">
 <label for="allowlist">Never hide these handles (comma or newline separated)</label>
 <textarea id="allowlist" rows="4"></textarea>
 <p><button id="save">Save</button><span id="saved"></span></p>
 <script src="lib/core.js"></script>
 <script src="options.js"></script>
</body></html>
